<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found · Elies Mlayah</title>
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%235b7fa6'/%3E%3Ctext x='32' y='43' font-family='Georgia,serif' font-size='30' font-weight='700' fill='%23e5ebf2' text-anchor='middle'%3EEM%3C/text%3E%3C/svg%3E">
<style>
  :root{
    --bg:#f3f5f7; --text:#1e242b; --muted:#5f6b78;
    --accent:#5b7fa6; --accent-dark:#3a5a7d; --accent-tint:#e5ebf2;
  }
  @media (prefers-color-scheme:dark){
    :root{ --bg:#14181c; --text:#e5eaef; --muted:#96a1ad;
           --accent:#7ea6c9; --accent-dark:#a9c7e2; --accent-tint:#242d36; }
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh;
    display:flex; align-items:center; justify-content:center;
    background:var(--bg); color:var(--text);
    font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    font-size:17px; line-height:1.65; text-align:center;
  }
  .wrap{max-width:34rem; padding:2rem 1.25rem;}
  .code{
    display:inline-block; margin:0 0 1rem;
    color:var(--accent-dark); font-size:.78rem;
    letter-spacing:.14em; text-transform:uppercase; font-weight:600;
  }
  h1{font-size:1.8rem; line-height:1.2; margin:0 0 .75rem; letter-spacing:-.01em;}
  p{margin:0 0 1.75rem; color:var(--muted);}
  a.home{
    display:inline-block; padding:.6rem 1.2rem;
    background:var(--accent-tint); color:var(--accent-dark);
    border-radius:8px; text-decoration:none; font-weight:600;
  }
  a.home:hover{background:var(--accent); color:var(--bg);}
  :focus-visible{outline:2px solid var(--accent); outline-offset:2px;}
</style>
</head>
<body>
  <main class="wrap">
    <p class="code">Error 404</p>
    <h1>This page does not exist</h1>
    <p>The link may be outdated, or the address mistyped.</p>
    <a class="home" href="/">Back to the home page</a>
  </main>
</body>
</html>
